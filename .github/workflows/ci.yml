name: Production Verification CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-and-typecheck:
    name: 🔒 Security, Types & Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Secret Leak Pattern Guard
        run: |
          echo "Scanning for accidental private keys or secret commits..."
          # Check for private key variable assignments with non-placeholder values
          ! grep -rnE '(BOT_WALLET_PRIVATE_KEY|HYPERLIQUID_WALLET_PRIVATE_KEY|JITO_AUTH_KEYPAIR)=[a-zA-Z0-9]{30,}' . \
            --exclude-dir={node_modules,.git,dist} \
            --exclude={.env.example}

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile All Workspace Packages (tsc)
        run: pnpm -r build

  unit-and-integration-tests:
    name: 🧪 Automated Test Suite
    runs-on: ubuntu-latest
    needs: security-and-typecheck
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Packages for Testing
        run: pnpm -r build

      - name: Run Test Suite
        run: pnpm test

  dashboard-production-build:
    name: 📊 Next.js Dashboard Build
    runs-on: ubuntu-latest
    needs: security-and-typecheck
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Dashboard
        run: pnpm --filter dashboard build
